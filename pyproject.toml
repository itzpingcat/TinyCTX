[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyctx"
version = "0.1.0"
requires-python = ">=3.14"
# CLI-only deps: everything needed to run `tinyctx onboard/start/stop/restart/status/launch`
# on the host. The full agent runtime (gateway, bridges, ai.py, etc.) runs inside Docker
# and its dependencies live under the `agent` extra below — install with `.[agent]` if you
# need to run that code outside a container.
dependencies = [
    "platformdirs",
    "PyYAML",
    "pyfiglet",
    "rich",
    "questionary",
    "requests",
]

[project.optional-dependencies]
agent = [
    "aiohttp",
    "mcp",
    "numpy",
    "tiktoken",
    "structlog",
    "tenacity",
    "ddgs",
    "camoufox[geoip]",
    "pdfplumber",
    "python-docx",
    "Pillow",
    "onnxruntime",
    "sympy",
    "antlr4-python3-runtime==4.13.2",
    "jinja2",
    "croniter",
    "python-dotenv",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash>=0.23,<0.26",
    "discord.py",
    "matrix-nio",
    "ladybug",
]

[project.scripts]
tinyctx = "TinyCTX.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["TinyCTX*"]
