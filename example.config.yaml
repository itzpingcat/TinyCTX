attachments:
  inline_max_bytes: 204800
  inline_max_files: 3
  uploads_dir: uploads
bridges: {}
command_introspection: false
concurrency:
  roster_priority: 13
cron:
  store_file: cron.db
ctx_tools:
  cot_keep_recent_turns: 10000
  same_call_dedup_after: 2
  token_sanitize:
    enabled: true
    roles:
    - tool
    - user
  tokenade_threshold: 20000
  tool_output:
    max_chars: 2000
    trim_after: 25
    truncate_after: 10
data:
  path: data
embed_cache_size: 2048
equipment_manifest:
  em_path: ''
  enabled: true
  prompt_priority: 5
error_introspection: false
filesystem:
  cache_size: 128
  page_size: 2000
  read_only_paths: []
gateway:
  api_key: ''
  enabled: false
  host: 127.0.0.1
  port: 8085
llm:
  fallback: []
  fallback_on:
    any_error: false
    http_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  primary: main
logging:
  level: INFO
max_tool_cycles: 20
mcp:
  servers: {}
memory:
  dedup:
    batch_count: 8
    enabled: true
    interval_hours: 6
    similarity_threshold: 0.85
  embedding_model: ''
  flaggers:
    decay_max_edges: 1
    decay_min_effective_mention: 0.5
    decay_stale_days: 90
    desc_max_chars: 1200
    desc_min_chars: 15
    edge_bloat_chars_per_edge: 10
    edge_bloat_min_edges: 10
    false_alias_max_cosine: 0.5
    fuzzy_name_threshold: 95
    max_edges_between: 4
  formatting:
    desc_truncate_chars: 2500
    injection_detail: low
  graph_path: memory/memory.lbug
  librarian:
    batch_size: 20
    ingest_pressure_min_tokens: 500
    ingest_pressure_ratio: 0.5
    max_concurrent: 4
    max_cycles: 40
    model: ''
    overlap_nodes: 5
    trigger_interval_hours: 6
  librarian_log: memory/librarian.log
  mention_half_life_days: 30
  passive_rag:
    bm25_weight: 0.4
    enabled: true
    memory_block_tokens: 2048
    mention_bump: 0.1
    min_p: 0.3
    rrf_k: 60
    search_min_p: 0.0
  pins:
    include_neighbors: false
    max_per_scope: 12
    priority: 5
    user_scan: 3
  reviewer:
    base_delay: 30
    enabled: true
    interval_hours: 6
    min_delay: 2
    target_len: 10
models:
  main:
    api_key_env: ANTHROPIC_API_KEY
    base_url: REPLACE_ME (e.g. https://api.anthropic.com/v1)
    budget_tokens: null
    cache_prompts: false
    context: 16384
    document_template: '{text}'
    kind: chat
    max_tokens: 2048
    model: REPLACE_ME (e.g. claude-sonnet-4-5)
    query_template: '{text}'
    reasoning_effort: null
    temperature: 0.7
    timeout: 60
    tokens_per_image: null
    vision: false
parallel: 3
permissions:
  minimal_tokens: false
  # template: not shown here — omitting this key gets the built-in empty
  # (fully closed) default documented in TinyCTX/config/__main__.py's
  # _DEFAULT_TEMPLATE and docs/PERMISSIONS-PLAN.md §2. There is a single
  # global template shared by every user; grant a specific user more via
  # their permission_overrides (/user modify_permissions,
  # onboard/fix_permissions.py, or the gateway's
  # /v1/user/{username}/elevate endpoint for full admin).
rag:
  auto_inject_priority: 25
  auto_inject_semantic: true
  bm25_weight: 0.3
  cache_dir: rag/.cache
  chunk_kwargs: {}
  chunk_strategy: markdown
  default_auto_targets: []
  embedding_model: ''
  indexed_extensions:
  - .md
  - .txt
  - .rst
  rag_dir: rag
  result_budget_tokens: 2048
  rrf_k: 60
  top_k: 5
router:
  host: 127.0.0.1
  port: 8765
shell:
  default_timeout: 120
  max_timeout: 1200
  sandbox_url: null
skills:
  dropped_footer_priority: 50
  ephemeral_categories: true
  index_priority: 5
  rescan_interval_seconds: 30
  skill_dirs:
  - skills
  tools: {}
system_prompt:
  agents:
    file: AGENTS.md
    priority: 10
  soul:
    file: SOUL.md
    priority: 0
  tools:
    file: TOOLS.md
    priority: 15
token_fuzz: 1.1
tools:
  overrides: {}
  passive:
    auto_bm25_enabled: true
    auto_limit: 2
    auto_min_score: 0.0
    auto_vector_enabled: false
    embedding_model: ''
    rrf_k: 60
  search:
    embedding_model: ''
    min_score: 0.0
    rrf_k: 60
    top_k: 5
    vector_enabled: false
web:
  browse_max_bytes: 2000000
  browse_max_chars: 20000
  browse_user_agent: TinyCTX/1.1
  headless: virtual
  ignore_tags:
  - script
  - style
  max_discovery_elements: 40
  output_dir: outputs/browser
  prompt_priority: 12
  screenshot_max_bytes: 1500000
  search_results: 5
  settle_timeout_ms: 15000
  shift_enter_for_newline: true
  timeout_ms: 30000
  tools: {}
  wait_until: domcontentloaded
workspace:
  path: workspace
