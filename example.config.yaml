attachments:
  inline_max_bytes: 204800
  inline_max_files: 3
  uploads_dir: uploads
bridges: {}
command_introspection: false
cron:
  store_file: CRON.json
ctx_tools:
  cot_keep_recent_turns: 10000
  max_tool_output_chars: 2000
  same_call_dedup_after: 2
  token_sanitize_enabled: true
  token_sanitize_roles:
  - tool
  - user
  tokenade_threshold: 20000
  tool_output_truncate_after: 10
  tool_trim_after: 25
data:
  path: data
embed_cache_size: 2048
equipment_manifest:
  em_path: ''
  enabled: true
  prompt_priority: 5
  trusted_threshold: 90
error_introspection: false
filesystem:
  cache_size: 128
  page_size: 2000
  read_only_paths: []
gateway:
  api_key: ''
  enabled: false
  host: 127.0.0.1
  port: 8085
heartbeat:
  ack_max_chars: 300
  active_hours: null
  branch_from: root
  continuation_prompt: <heartbeat_sentinel>Continue the task, or reply NO_REPLY when
    you are done.</heartbeat_sentinel>
  every_minutes: 30
  max_continuations: 5
  prompt: <heartbeat_sentinel>Read HEARTBEAT.md if it exists (workspace context).
    Follow it strictly. Do not infer or repeat old tasks from prior chats. If nothing
    needs attention, reply NO_REPLY.</heartbeat_sentinel>
llm:
  fallback: []
  fallback_on:
    any_error: false
    http_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  primary: main
logging:
  level: INFO
max_tool_cycles: 20
mcp:
  servers: {}
memory:
  batch_size: 20
  bm25_weight: 0.4
  decay_max_edges: 1
  decay_min_effective_mention: 0.5
  decay_stale_days: 90
  dedup_batch_count: 8
  dedup_enabled: true
  dedup_interval_hours: 6
  desc_max_chars: 1200
  desc_min_chars: 15
  embedding_model: ''
  fuzzy_name_threshold: 95
  graph_path: memory/memory.lbug
  ingest_pressure_min_tokens: 500
  ingest_pressure_ratio: 0.5
  librarian_log: memory/librarian.log
  librarian_model: ''
  max_concurrent: 4
  max_edges_between: 4
  max_pins_per_scope: 12
  memory_block_tokens: 2048
  mention_half_life_days: 30
  passive_mention_bump: 0.1
  passive_min_p: 0.3
  passive_rag_enabled: true
  pin_include_neighbors: false
  pinned_priority: 5
  pinned_user_scan: 3
  reviewer_base_delay: 30
  reviewer_enabled: true
  reviewer_interval_hours: 6
  reviewer_min_delay: 2
  reviewer_target_len: 10
  rrf_k: 60
  search_min_p: 0.0
  similarity_threshold: 0.85
  trigger_interval_hours: 6
models:
  main:
    api_key_env: ANTHROPIC_API_KEY
    base_url: REPLACE_ME (e.g. https://api.anthropic.com/v1)
    budget_tokens: null
    cache_prompts: false
    context: 16384
    document_template: '{text}'
    kind: chat
    max_tokens: 2048
    model: REPLACE_ME (e.g. claude-sonnet-4-5)
    query_template: '{text}'
    reasoning_effort: null
    temperature: 0.7
    timeout: 60
    tokens_per_image: null
    vision: false
parallel: 3
permissions:
  minimal_tokens: false
rag:
  auto_inject_priority: 25
  auto_inject_semantic: true
  bm25_weight: 0.3
  cache_dir: rag/.cache
  chunk_kwargs: {}
  chunk_strategy: markdown
  default_auto_targets: []
  embedding_model: ''
  indexed_extensions:
  - .md
  - .txt
  - .rst
  rag_dir: rag
  result_budget_tokens: 2048
  top_k: 5
router:
  host: 127.0.0.1
  port: 8765
shell:
  default_timeout: 120
  max_timeout: 1200
  sandbox_url: null
skills:
  dropped_footer_priority: 50
  ephemeral_categories: true
  index_priority: 5
  rescan_interval_seconds: 30
  skill_dirs:
  - skills
  tools: {}
subagents:
  completed_ttl_seconds: 900.0
  max_concurrent: 4
  prompt_priority: 13
sysops:
  model_min_permission: 75
system_prompt:
  agents_file: AGENTS.md
  agents_priority: 10
  soul_file: SOUL.md
  soul_priority: 0
  tools_file: TOOLS.md
  tools_priority: 15
todo:
  prompt_priority: 8
token_fuzz: 1.1
tool_overrides: {}
web:
  browse_max_bytes: 2000000
  browse_max_chars: 20000
  browse_user_agent: TinyCTX/1.1
  downloads_dir: downloads
  headless: false
  ignore_tags:
  - script
  - style
  max_discovery_elements: 40
  prompt_priority: 12
  search_results: 5
  shift_enter_for_newline: true
  timeout_ms: 30000
  tools: {}
  wait_until: domcontentloaded
workspace:
  path: workspace
